name: macOS Visual for RustDesk
on: 
  workflow_dispatch:

jobs:
  mac-rustdesk-session:
    runs-on: macos-14
    steps:
      - name: Install RustDesk via Homebrew
        run: |
          brew install --cask rustdesk

      - name: Run RustDesk in Foreground Process
        run: |
          echo "Memulai RustDesk..."
          # Menjalankan langsung aplikasi utama di background proses CI
          sudo /Applications/RustDesk.app/Contents/MacOS/rustdesk --daemon &
          sleep 10

      - name: Configure RustDesk Password
        run: |
          # Mengatur password default menjadi 123456
          sudo /Applications/RustDesk.app/Contents/MacOS/rustdesk --password 123456
          sleep 5

      - name: Display RustDesk Connection Info
        run: |
          echo "============================================="
          echo "RUSTDESK CONNECTION DETAILS:"
          echo "============================================="
          # Mengambil ID RustDesk yang di-generate otomatis
          RUSTDESK_ID=$(/Applications/RustDesk.app/Contents/MacOS/rustdesk --get-id 2>/dev/null)
          echo "Your RustDesk ID: $RUSTDESK_ID"
          echo "Your Password   : 123456"
          echo "============================================="
          
      - name: Keep Alive Session
        run: |
          echo "Sesi berjalan... Silakan hubungi via RustDesk."
          # Menjaga runner tetap aktif selama 1 jam (3600 detik)
          sleep 3600
