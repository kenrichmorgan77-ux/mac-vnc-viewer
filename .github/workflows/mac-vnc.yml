name: Ubuntu Visual for RustDesk
on: 
  workflow_dispatch:

jobs:
  ubuntu-rustdesk-session:
    runs-on: ubuntu-latest
    steps:
      - name: Install Desktop Environment & Dependencies
        run: |
          sudo apt-get update
          # Menginstal GUI ringan (XFCE) dan Virtual Framebuffer serta dependensi RustDesk
          sudo apt-get install -y xfce4 xfce4-goodies xvfb wget curl libgtk-3-0 libxcb-randr0 libxdo3 libnss3

      - name: Download RustDesk Portable Binary
        run: |
          echo "Mengunduh paket portabel RustDesk..."
          # Menggunakan GitHub API Endpoint resmi untuk bypass deteksi bot HTML
          curl -s https://github.com | grep "browser_download_url" | grep "x86_64.deb" | cut -d '"' -f 4 | head -n 1 | xargs curl -L -o rustdesk.deb
          
          echo "Memeriksa validitas paket..."
          file rustdesk.deb
          
          echo "Mengekstrak dan menginstal paket sistem..."
          sudo dpkg -i rustdesk.deb || sudo apt-get install -f -y

      - name: Start Virtual Display & RustDesk Service
        run: |
          echo "Memulai Virtual Desktop..."
          Xvfb :1 -screen 0 1280x1024x24 &
          export DISPLAY=:1
          
          echo "Memulai sesi XFCE Desktop..."
          startxfce4 &
          sleep 5

          echo "Mengaktifkan service kontrol..."
          sudo systemctl start rustdesk || true
          
          # Mengatur password akses manual menjadi 123456
          sudo rustdesk --password 123456

      - name: Display RustDesk Connection Info
        run: |
          echo "============================================="
          echo "RUSTDESK CONNECTION DETAILS:"
          echo "============================================="
          # Mengambil ID unik dari sistem Linux
          RUSTDESK_ID=$(sudo rustdesk --get-id 2>/dev/null)
          echo "Your RustDesk ID: $RUSTDESK_ID"
          echo "Your Password   : 123456"
          echo "============================================="

      - name: Keep Alive Session
        run: |
          echo "Sesi Ubuntu aktif! Silakan remote menggunakan ID di atas."
          sleep 3600
