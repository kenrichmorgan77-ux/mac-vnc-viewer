name: Ubuntu Visual for RustDesk
on: 
  workflow_dispatch:

jobs:
  ubuntu-rustdesk-session:
    runs-on: ubuntu-latest
    steps:
      - name: Install Desktop Environment & Dependencies
        run: |
          sudo apt-get update
          # Menginstal GUI ringan (XFCE) dan Virtual Framebuffer
          sudo apt-get install -y xfce4 xfce4-goodies xvfb

      - name: Install RustDesk via Snap
        run: |
          echo "Menginstal RustDesk dari Snap Store resmi..."
          # Menggunakan snap untuk menghindari masalah unduhan berkas HTML/SSL
          sudo snap install rustdesk

      - name: Start Virtual Display & RustDesk Service
        run: |
          echo "Memulai Virtual Desktop..."
          Xvfb :1 -screen 0 1280x1024x24 &
          export DISPLAY=:1
          
          echo "Memulai sesi XFCE Desktop..."
          startxfce4 &
          sleep 5

          echo "Mengatur password akses manual RustDesk..."
          # Mengonfigurasi kata sandi otentikasi melalui snap-command RustDesk
          sudo snap run rustdesk --password 123456

      - name: Display RustDesk Connection Info
        run: |
          echo "============================================="
          echo "RUSTDESK CONNECTION DETAILS:"
          echo "============================================="
          # Mengambil ID koneksi unik RustDesk
          RUSTDESK_ID=$(sudo snap run rustdesk --get-id 2>/dev/null)
          echo "Your RustDesk ID: $RUSTDESK_ID"
          echo "Your Password   : 123456"
          echo "============================================="

      - name: Keep Alive Session
        run: |
          echo "Sesi Ubuntu aktif! Silakan remote menggunakan ID di atas."
          sleep 3600
