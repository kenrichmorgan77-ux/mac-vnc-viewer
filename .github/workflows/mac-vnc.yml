name: Ubuntu Visual for RustDesk
on: 
  workflow_dispatch:

jobs:
  ubuntu-rustdesk-session:
    runs-on: ubuntu-latest
    steps:
      - name: Install Desktop Environment & Dependencies
        run: |
          sudo apt-get update
          # Menginstal GUI ringan (XFCE) dan Virtual Framebuffer
          sudo apt-get install -y xfce4 xfce4-goodies xvfb wget

      - name: Download and Install RustDesk
        run: |
          echo "Mengunduh RustDesk versi resmi Linux..."
          # Menggunakan URL direct-download rilis stabil terbaru
          wget -O rustdesk.deb https://github.com
          
          echo "Menginstal RustDesk..."
          # Menggunakan apt install untuk bypass dependency otomatis
          sudo apt-get install -y ./rustdesk.deb

      - name: Start Virtual Display & RustDesk Service
        run: |
          echo "Memulai Virtual Desktop..."
          # Menjalankan Xvfb di background agar GUI bisa dirender tanpa monitor fisik
          Xvfb :1 -screen 0 1280x1024x24 &
          export DISPLAY=:1
          
          echo "Memulai sesi XFCE Desktop..."
          startxfce4 &
          sleep 5

          echo "Mengaktifkan RustDesk service..."
          sudo systemctl start rustdesk || true
          
          # Mengatur password akses manual menjadi 123456
          sudo rustdesk --password 123456

      - name: Display RustDesk Connection Info
        run: |
          echo "============================================="
          echo "RUSTDESK CONNECTION DETAILS:"
          echo "============================================="
          # Mengambil ID unik dari sistem Linux
          RUSTDESK_ID=$(sudo rustdesk --get-id 2>/dev/null)
          echo "Your RustDesk ID: $RUSTDESK_ID"
          echo "Your Password   : 123456"
          echo "============================================="

      - name: Keep Alive Session
        run: |
          echo "Sesi Ubuntu aktif! Silakan remote menggunakan ID di atas."
          sleep 3600
